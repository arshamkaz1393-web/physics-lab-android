
name: Build Physics Lab APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhysicsLab_AndroidStudio_Project.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip PhysicsLab_AndroidStudio_Project.zip -d buildsrc
          test -f buildsrc/PhysicsLabAndroid/settings.gradle

      - name: Build APK
        working-directory: buildsrc/PhysicsLabAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhysicsLab-debug-apk
          path: buildsrc/PhysicsLabAndroid/app/build/outputs/apk/debug/app-debug.apk
